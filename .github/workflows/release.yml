name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm installer:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: pnpm exec playwright install chromium
      - run: pnpm test:app
      - name: Verify macOS app signatures and installers
        run: |
          codesign --verify --deep --strict "desktop/out/mac-arm64/YT Beatmaker Cues Desktop.app"
          codesign --verify --deep --strict "desktop/out/mac/YT Beatmaker Cues Desktop.app"
          hdiutil verify release/*-macOS-arm64.dmg
          hdiutil verify release/*-macOS-x64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: yt-beatmaker-cues-desktop-macos
          path: release/YT-Beatmaker-Cues-Desktop-*-macOS-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm installer:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: yt-beatmaker-cues-desktop-windows
          path: release/YT-Beatmaker-Cues-Desktop-*-Windows*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm installer:linux
      - uses: actions/upload-artifact@v7
        with:
          name: yt-beatmaker-cues-desktop-linux
          path: |
            release/YT-Beatmaker-Cues-Desktop-*-Linux*.AppImage
            release/YT-Beatmaker-Cues-Desktop-*-Linux*.deb
          if-no-files-found: error

  publish:
    needs: [mac, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS-1.0.0.txt
          cat SHA256SUMS-1.0.0.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
