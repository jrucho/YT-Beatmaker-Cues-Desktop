name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node scripts/check-controller-mapping.mjs
      - run: pnpm installer:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: pnpm exec playwright install chromium
      - run: pnpm test:app
      - name: Verify macOS app signatures and installers
        run: |
          codesign --verify --deep --strict "desktop/out/mac-arm64/YT Beatmaker Cues Desktop.app"
          codesign --verify --deep --strict "desktop/out/mac/YT Beatmaker Cues Desktop.app"
          hdiutil verify release/*-macOS-arm64.dmg
          hdiutil verify release/*-macOS-x64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: yt-beatmaker-cues-desktop-macos
          path: release/YT-Beatmaker-Cues-Desktop-*-macOS-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm installer:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: yt-beatmaker-cues-desktop-windows
          path: release/YT-Beatmaker-Cues-Desktop-*-Windows*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm installer:linux
      - uses: actions/upload-artifact@v7
        with:
          name: yt-beatmaker-cues-desktop-linux
          path: |
            release/YT-Beatmaker-Cues-Desktop-*-Linux*.AppImage
            release/YT-Beatmaker-Cues-Desktop-*-Linux*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-controller-mapping.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/check-android-cues.mjs
      - name: Build Android test APK
        run: |
          pnpm --filter @musike/mobile build
          sh mobile/android/gradlew -p mobile/android assembleDebug --console=plain
          mkdir -p release
          VERSION=$(node -p 'require("./mobile/package.json").version')
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "release/Beatmaker-Cues-Test-${VERSION}-Android.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "release/Beatmaker-Cues-Test-${VERSION}-Android.apk"
          (cd release && sha256sum *.apk > "SHA256SUMS-Android-${VERSION}.txt")
      - uses: actions/upload-artifact@v7
        with:
          name: beatmaker-cues-android
          path: |
            release/*-Android.apk
            release/SHA256SUMS-Android-*.txt
          if-no-files-found: error

  publish:
    needs: [mac, windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > "SHA256SUMS-${GITHUB_REF_NAME#v}.txt"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
