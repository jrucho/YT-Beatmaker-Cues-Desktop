include ':pluginStandalone'
project(':pluginStandalone').projectDir = new File(rootDir, '../../plugin/Android/app')
// The JUCE port builds independently of Capacitor's generated sync files.
if (!gradle.startParameter.projectProperties.containsKey('beatmakerStandaloneOnly')) {
    include ':app'
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')
    apply from: 'capacitor.settings.gradle'
}
